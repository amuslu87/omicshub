version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:16
    container_name: omicshub-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: xxxxxx
      POSTGRES_DB: omicshub
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db:/docker-entrypoint-initdb.d
    ports:
      - "54xx:54xx"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - omicshub-network

  # FastAPI Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omicshub-api
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: omicshub
      DATABASE_USER: postgres
      DATABASE_PASSWORD: xxxxxxx
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - omicshub-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  omicshub-network:
    driver: bridge
